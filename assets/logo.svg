<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Geometric Hex Emblem -->
  <g transform="translate(100, 120)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glow)" opacity="0.8"/>
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" fill="none" stroke="url(#violetGrad)" stroke-width="2" opacity="0.6"/>
    <!-- Core Energy Lightning -->
    <path d="M-8,-25 L8,-8 L-4,2 L10,25" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="200" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="4" fill="#ffffff">
    AETHER <tspan fill="url(#cyanGrad)">IDE</tspan>
  </text>
  <text x="204" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#94a3b8">
    LOCAL-FIRST AUTONOMOUS AI CODING AGENT
  </text>
  <text x="204" y="175" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="400" fill="#38bdf8" opacity="0.9">
    ⚡ 100% Offline · Ollama + RTX 4060 · ReAct Loop · Self-Healing · $0 API Cost
  </text>
</svg>
